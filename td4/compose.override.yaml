services:
  api:
    build:
      target: dev
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: ./app/src
          target: /app/src
        - action: rebuild
          path: ./app/package.json

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
