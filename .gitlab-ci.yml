image: docker:29-cli

services:
  - name: docker:29-dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: "$CI_REGISTRY_IMAGE/visites-api:$CI_COMMIT_SHORT_SHA"

stages:
  - build
  - scan
  - test
  - publish

build:
  stage: build
  script:
    - docker build --target prod -t "$IMAGE_TAG" td4/app
    - docker save "$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

scan:
  stage: scan
  needs:
    - job: build
      artifacts: true
  script:
    - docker create --name trivy-scan aquasec/trivy:0.74.0 image --input /image.tar --severity CRITICAL --exit-code 1
    - docker cp image.tar trivy-scan:/image.tar
    - docker start -a trivy-scan

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - docker load -i image.tar
    - docker network create ci-visites
    - docker run -d --name db --network ci-visites -e POSTGRES_DB=visites -e POSTGRES_USER=visites_user -e POSTGRES_PASSWORD=test-password postgres:18-alpine
    - docker run -d --name cache --network ci-visites redis:8-alpine
    - until docker run --rm --network ci-visites postgres:18-alpine pg_isready -h db -U visites_user -d visites; do sleep 2; done
    - docker run --rm --network ci-visites redis:8-alpine redis-cli -h cache ping
    - docker run -d --name api --network ci-visites -e DB_HOST=db -e DB_PORT=5432 -e DB_NAME=visites -e DB_USER=visites_user -e DB_PASSWORD=test-password -e REDIS_URL=redis://cache:6379 "$IMAGE_TAG"
    - |
      for i in $(seq 1 30); do
        if docker run --rm --network ci-visites curlimages/curl:8.15.0 -fsS http://api:3000/health; then
          break
        fi
        if [ "$i" = 30 ]; then
          docker logs api
          exit 1
        fi
        sleep 2
      done
    - docker run --rm --network ci-visites curlimages/curl:8.15.0 -fsS http://api:3000/
  after_script:
    - docker rm -f api db cache || true
    - docker network rm ci-visites || true

publish:
  stage: publish
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_TAG"
